spring:
  application:
    name: order-service
  datasource:
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 환경 변수가 relaxed binding으로 이 값을 덮어쓴다.
    url: jdbc:postgresql://localhost:5432/order
    username: order
    password: order
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  jackson:
    time-zone: UTC
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
      fail-on-null-for-primitives: true
      fail-on-unknown-properties: false
    mapper:
      allow-coercion-of-scalars: false

server:
  port: 8080   # SERVER_PORT 로 덮어쓴다 (relaxed binding)

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL:http://localhost:9090}
    timeout: PT2S

order:
  payment-ttl: ${ORDER_PAYMENT_TTL:PT15M}
  expiry:
    sweep-interval: PT0.2S
    in-flight-timeout: PT10S
  idempotency:
    in-progress-timeout: PT30S
