spring:
  application:
    name: order-service
  datasource:
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 환경 변수가 relaxed binding 으로 덮어쓴다.
    url: jdbc:postgresql://localhost:5432/orders
    username: orders
    password: orders
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080 # SERVER_PORT 환경 변수가 덮어쓴다.

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL:http://localhost:9090}
    timeout: PT2S

order:
  payment:
    ttl: ${ORDER_PAYMENT_TTL:PT15M}
  expiry:
    scan-interval: PT0.5S
