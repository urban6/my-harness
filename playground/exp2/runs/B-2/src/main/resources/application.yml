spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order}
    username: ${SPRING_DATASOURCE_USERNAME:order}
    # password: SPRING_DATASOURCE_PASSWORD 환경 변수로만 주입한다
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  port: ${SERVER_PORT:8080}

order:
  payment-ttl: ${ORDER_PAYMENT_TTL:PT15M}
  expiration-interval: 500ms

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL:http://localhost:9090}
    timeout: 2s
