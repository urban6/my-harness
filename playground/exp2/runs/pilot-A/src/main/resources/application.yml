spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 30
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      adjust-dates-to-context-time-zone: false
      fail-on-null-for-primitives: true
      fail-on-trailing-tokens: true

server:
  port: ${SERVER_PORT:8080}

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL:http://localhost:9090}
    timeout: PT2S

order:
  payment:
    ttl: ${ORDER_PAYMENT_TTL:PT15M}
  expiration:
    poll-interval-ms: 300
