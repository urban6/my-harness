spring:
  application:
    name: order-service
  datasource:
    # SPRING_DATASOURCE_PASSWORD 는 기본값 없이 환경에서 주입한다(relaxed binding).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  port: ${SERVER_PORT:8080}

order:
  payment-ttl: ${ORDER_PAYMENT_TTL:PT15M}
  expiry-sweep-interval: PT0.5S

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL:http://localhost:9090}
    timeout: PT2S
