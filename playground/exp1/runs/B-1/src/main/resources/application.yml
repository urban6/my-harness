spring:
  application:
    name: order-service
  # 표준 속성. 실행 시 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD 로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: order
    # password 는 기본값을 두지 않는다 — SPRING_DATASOURCE_PASSWORD 환경 변수로 주입
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  jackson:
    deserialization:
      # 정수 필드(price, stock, quantity)에 1.5 같은 소수가 들어오면 잘라내지 않고 400으로 거절
      accept-float-as-int: false

# SERVER_PORT 환경 변수로 덮어쓴다.
server:
  port: 8080
