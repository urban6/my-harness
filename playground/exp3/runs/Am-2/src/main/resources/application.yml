spring:
  application:
    name: order-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL:http://localhost:9090}

order:
  payment-ttl: ${ORDER_PAYMENT_TTL:PT15M}
