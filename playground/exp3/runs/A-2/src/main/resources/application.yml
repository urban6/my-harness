server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order}
    username: ${SPRING_DATASOURCE_USERNAME:order}
    password: ${SPRING_DATASOURCE_PASSWORD:order}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

order:
  payment-ttl: ${ORDER_PAYMENT_TTL:PT15M}
  expiry-sweep-interval: PT0.25S

payment:
  gateway:
    url: ${PAYMENT_GATEWAY_URL:http://localhost:9999}
    connect-timeout: PT2S
    read-timeout: PT10S
