spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}

app:
  payment-gateway-url: ${PAYMENT_GATEWAY_URL:http://localhost:9090}
  order-payment-ttl: ${ORDER_PAYMENT_TTL:PT15M}
  payment-lock-timeout: PT1M
  expiration-scan-interval: PT1S
